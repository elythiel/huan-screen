name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        run: make app

      - name: Smoke test the command line
        run: '"build/Huan Screen.app/Contents/MacOS/HuanScreen" --help'
